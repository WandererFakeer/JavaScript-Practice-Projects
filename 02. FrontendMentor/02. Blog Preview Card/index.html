<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <figure class="header-figure">
        <img
          src="assets/images/illustration-article.svg"
          alt="An example illustration for the article"
          class="header-image"
        />
        <figcaption class="header-caption">
          <h2 class="header-tag">Learning</h2>
          <p class="header-date">
            Published <time datetime="2023-12-21">21 Dec 2023</time>
          </p>
        </figcaption>
      </figure>

      <article>
        <h1 class="article-heading"><a href="#">HTML & CSS foundations</a></h1>
        <p class="article-para">
          These languages are the backbone of every website, defining structure,
          content, and presentation
        </p>

        <figure class="article-author">
          <img
            src="assets/images/image-avatar.webp"
            alt="The headshot of the author of the above article"
          />
          <figcaption>
            <h2>Greg Hooper</h2>
          </figcaption>
        </figure>
      </article>
    </main>
  </body>
</html>

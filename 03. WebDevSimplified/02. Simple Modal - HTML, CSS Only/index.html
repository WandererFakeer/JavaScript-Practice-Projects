<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Modal - HTML, CSS Only</title>
</head>
<body>
    <main>
      <button command="show-modal" commandfor="modal-box" class="open-modal">Open Modal</button>
      
      <dialog id="modal-box" closedby="any">
        <h1>This is a Modal</h1>
        <button command="close" commandfor="modal-box">Close Modal</button>
      </dialog>
        
    </main>
</body>
</html>

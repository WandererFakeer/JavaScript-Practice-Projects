<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midi Piano</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module"></script>
</head>
<body>
    <main class="piano">
        <button type="button" data-note="C" class="key white"></button>
        <button type="button" data-note="Db" class="key black"></button>
        <button type="button" data-note="D" class="key white"></button>
        <button type="button" data-note="Eb" class="key black"></button>
        <button type="button" data-note="E" class="key white"></button>
        <button type="button" data-note="F" class="key white"></button>
        <button type="button" data-note="Gb" class="key black"></button>
        <button type="button" data-note="G" class="key white"></button>
        <button type="button" data-note="Ab" class="key black"></button>
        <button type="button" data-note="A" class="key white"></button>
        <button type="button" data-note="Bb" class="key black"></button>
        <button type="button" data-note="B" class="key white"></button>
    </main>
</body>
</html>

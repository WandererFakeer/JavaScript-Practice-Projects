<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <main>
        <section class="error-section" id="error-section" role="alert" aria-labelledby="form-error" hidden>
            <h2 class="form-error-heading" id="form-error">Error</h2>
            <ul class="form-error-list" id="form-error-list"></ul>
        </section>

        <form action="" id="form">
            <div class="data">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" value="">
            </div>

            <div class="data">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" value="">
            </div>

            <div class="data">
                <label for="password-confirmation">Password Confirmation</label>
                <input type="password" name="password-confirmation" id="password-confirmation" value="">
            </div>

            <div class="data checkbox-item">
                <input type="checkbox" name="agree" id="agree" value="agree">
                <label for="agree">Agree To Terms?</label>
            </div>
            
            <button type="submit">Create Account</button>
        </form>

        <article id="thanks-page" hidden></article>
    </main>
</body>
</html>

<main>
  <h1>My Emojis</h1>
  
  <ul class="emoji-container" id="emoji-container"></ul>
  
  <input type="text" placeholder="type an emoji 🎉">
  
  <div class="button-container" role="group" aria-label="Add Emoji Action">
    <button class="add" id="add-end" type="button">Add to end</button>
    <button class="add" id="add-beginning" type="button">Add to beginning</button>
  </div>
  
  <div class="button-container" role="group" aria-label="Remove Emoji Action">
    <button class="remove" id="remove-end" type="button">Remove from end</button>
    <button class="remove" id="remove-beginning" type="button">Remove from beginning</button>
  </div>
</main>

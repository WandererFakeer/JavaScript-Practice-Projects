<main>
  <h1>People Counter App In Train Station</h1>
  <p class="enter-counter" aria-live="polite" aria-atomic="true">
    People entered: <span id="enter-count">0</span>
  </p>
  <div class="button-container" role="group" aria-label="Counter actions">
    <button id="increment" type="button">Increment</button>
    <button id="save" type="button">Save</button>
  </div>

  <p class="save-counter" aria-live="polite" aria-atomic="true">
    Previous entries: <span id="saved-count"></span>
  </p>
</main>

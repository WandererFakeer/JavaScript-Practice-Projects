<header class="heading-header">
  <button class="new-deck" type="button">New Deck</button>
  <p class="remaining" aria-live="polite" aria-atomic="true">
    Remaining cards: <span class="remaning-card">0</span>
  </p>
</header>

<main>
  <header class="main-header">
    <h1 class="heading" aria-live="polite" aria-atomic="true"></h1>
  </header>

  <article class="info" id="computer-info">
    <p aria-live="polite" aria-atomic="true">
      Computer score: <span class="computer-score">0</span>
    </p>
    <div class="image-wrapper" id="computer-image-wrapper"></div>
  </article>

  <article class="info" id="player-info">
    <p aria-live="polite" aria-atomic="true">
      Your score: <span class="player-score">0</span>
    </p>
    <div class="image-wrapper" id="player-image-wrapper"></div>
  </article>
</main>

<footer>
  <button class="draw-card-button" type="button">Draw</button>
</footer>

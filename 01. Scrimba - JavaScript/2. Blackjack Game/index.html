<main>
  <h1>Blackjack</h1>
  <p class="heading" id="heading" aria-live="polite" aria-atomic="true">Want to play Blackjack? Press the "START GAME" button</p>
  <p class="card-hand" id="card-hand" aria-live="polite" aria-atomic="true">Cards: <span class="hand" id="hand"></span></p>
  
   <p class="card-sum" id="card-sum" aria-live="polite" aria-atomic="true">Sum: <span class="sum" id="sum"></span></p>
  
  <div class="button-container" role="group" aria-label="Game controls">
    <button id="start" type="button">Start Game</button>
    <button id="new" type="button">New Card</button>
  </div>
  
</main>
